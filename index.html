<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интернет-магазин</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Наши товары</h1>
        
        <div class="products">
            <div class="product" data-id="1">
                <h3>Клавиатура Smartbuy</h3>
                <p>Цена: <span class="price">12000</span> ₸</p>
                <button class="add-to-cart">Добавить в корзину</button>
            </div>
            
            <div class="product" data-id="2">
                <h3>Мышки Smartbuy</h3>
                <p>Цена: <span class="price">2800</span> ₸</p>
                <button class="add-to-cart">Добавить в корзину</button>
            </div>
            
            <div class="product" data-id="3">
                <h3>Удленитель Smartbuy</h3>
                <p>Цена: <span class="price">1800</span> ₸</p>
                <button class="add-to-cart">Добавить в корзину</button>
            </div>
        </div>
        
        <div class="cart">
            <h2>Корзина</h2>
            <div class="alert"></div>
            <div class="order-form" style="display: none;">
                <input type="tel" class="phone-input" placeholder="+79876543210" pattern="\+7\d{10}" title="Формат: +7XXXXXXXXXX">
                <button class="confirm-order">Подтвердить заказ</button>
            </div>
            <div class="cart-items">
                <p>Корзина пуста</p>
            </div>
            <div class="cart-total">
                <strong>Итого: </strong><span class="total-price">0</span>  KZT
            </div>
            <button class="clear-cart">Очистить корзину</button>
            <button class="send-order">Отправить заказ</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
